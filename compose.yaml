services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      TOKEN: ${TOKEN}
      PUBLIC_URL: https://${DOMAIN}
      ALLOWED_HOSTS: bilivideo.com,bilivideo.cn,biliapi.net,akamaized.net
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_MEDIA_SUCCESS: "${LOG_MEDIA_SUCCESS:-false}"
      LOG_SUMMARY_INTERVAL: "${LOG_SUMMARY_INTERVAL:-60s}"
      LOG_ERROR_DEDUP_INTERVAL: "${LOG_ERROR_DEDUP_INTERVAL:-10s}"
      LOG_CLIENT_IP: "${LOG_CLIENT_IP:-masked}"
      TRACE_DIR: /traces
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - traces:/traces

volumes:
  traces:
